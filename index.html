<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="description" content="CraftLite — jogo de voxels no navegador. Projeto independente.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CraftLite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%236c9c3f'/><rect y='6' width='16' height='10' fill='%238b6239'/></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0d12;color:#fff;
    font-family:ui-monospace,"Courier New",monospace;-webkit-text-size-adjust:100%;
    overscroll-behavior:none;overscroll-behavior-y:none}
  /* `touch-action:none` bloqueia zoom, scroll e pull-to-refresh (doc 09 §2.3). */
  body{touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
    position:fixed;inset:0;width:100%;height:100%}
  #view{position:fixed;inset:0;display:block;width:100%;height:100%;background:#0b0d12;
    touch-action:none}
  /* O `hidden` do HTML vale menos que qualquer regra com seletor de id ou
     classe, então sem isto elementos marcados como ocultos continuam na tela. */
  [hidden]{display:none!important}
  #boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;justify-items:center;
    background:#0b0d12;z-index:10;transition:opacity .25s}
  #boot.hidden{opacity:0;pointer-events:none}
  #boot h1{margin:0;font-size:28px;letter-spacing:.28em;font-weight:700}
  #boot p{margin:0;font-size:12px;opacity:.6}
  #boot .bar{width:180px;height:4px;background:#232833}
  #boot .bar i{display:block;height:100%;width:0;background:#6c9c3f;transition:width .2s}
</style>
</head>
<body>
  <canvas id="view" aria-label="Mundo do jogo"></canvas>
  <div id="boot" role="status" aria-live="polite">
    <h1>CRAFTLITE</h1>
    <div class="bar"><i id="boot-bar"></i></div>
    <p id="boot-msg">iniciando…</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
