<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Criar novo mundo">
<title>Criar novo mundo</title>
<style>
  .bg    { fill:#1b1d21 }
  .panel { fill:#2b2f36; stroke:#7d8794; stroke-width:2 }
  .panel2{ fill:#232830; stroke:#5c6672; stroke-width:1.5 }
  .slot  { fill:#3a4049; stroke:#6f7885; stroke-width:1 }
  .slotA { fill:#4a5460; stroke:#cfd6e0; stroke-width:2 }
  .btn   { fill:#3d4450; stroke:#8b94a3; stroke-width:1.5 }
  .btnA  { fill:#4d5a75; stroke:#cfd6e0; stroke-width:2 }
  .t     { fill:#e6eaf0; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:12px }
  .tc    { fill:#e6eaf0; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:12px;
           text-anchor:middle }
  .ts    { fill:#98a2b3; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:10px }
  .tsc   { fill:#98a2b3; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:10px;
           text-anchor:middle }
  .th    { fill:#ffd166; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:15px;
           text-anchor:middle }
  .tt    { fill:#7dd3a0; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:11px }
  .dim   { fill:#000; opacity:.45 }
  .heart { fill:#dc4040 }
  .hung  { fill:#c68a45 }
  .xp    { fill:#7fc94b }
  .guide { stroke:#5c6672; stroke-width:1; stroke-dasharray:4 3; fill:none }
  .note  { fill:#ffd166; font-family:ui-monospace,'DejaVu Sans Mono',monospace; font-size:10px }
</style>
<rect class="bg" width="960" height="540"/>
<text class="th" x="480.0" y="26">03 — Criar Novo Mundo</text>
<text class="t" x="180" y="98">Nome do Mundo</text>
<rect class="btn" x="520" y="78" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="98">[ Novo Mundo            ]</text>
<text class="t" x="180" y="142">Modo de Jogo</text>
<rect class="btn" x="520" y="122" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="142">&lt; Sobrevivência &gt;</text>
<text class="t" x="180" y="186">Dificuldade</text>
<rect class="btn" x="520" y="166" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="186">&lt; Normal &gt;</text>
<text class="t" x="180" y="230">Seed (vazio = aleatória)</text>
<rect class="btn" x="520" y="210" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="230">[                       ]</text>
<text class="t" x="180" y="274">Tipo de Mundo</text>
<rect class="btn" x="520" y="254" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="274">&lt; Padrão &gt;</text>
<text class="t" x="180" y="318">Gerar Estruturas</text>
<rect class="btn" x="520" y="298" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="318">[ ON  ]</text>
<text class="t" x="180" y="362">Bônus de Baú</text>
<rect class="btn" x="520" y="342" width="260" height="30" rx="2"/>
<text class="tc" x="650" y="362">[ OFF ]</text>
<rect class="btn" x="180" y="392" width="260" height="32" rx="2"/>
<text class="tc" x="310.0" y="412.0">Mais Opções...</text>
<text class="ts" x="460" y="412">ciclo dia/noite, dano de fogo, drop ao morrer</text>
<rect class="btnA" x="300" y="452" width="160" height="32" rx="2"/>
<text class="tc" x="380.0" y="472.0">Criar Novo Mundo</text>
<rect class="btn" x="480" y="452" width="160" height="32" rx="2"/>
<text class="tc" x="560.0" y="472.0">Cancelar</text>

</svg>
