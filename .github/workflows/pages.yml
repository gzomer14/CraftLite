# Publica o jogo no GitHub Pages a cada push na `main`.
#
# O `dist/` fica fora do repositório (está no `.gitignore`), então quem monta o
# site é este workflow: instala, roda os portões de qualidade e sobe o build.
#
# Os portões rodam **antes** do deploy de propósito. O projeto exige que eles
# estejam verdes antes de qualquer entrega (CLAUDE.md), e aqui isso vira regra
# de máquina: teste vermelho, lint sujo ou orçamento estourado não chegam ao ar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite republicar pela aba Actions sem precisar de um commit novo.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; se dois pushes se cruzarem, vence o mais novo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` e não `npm install`: respeita o package-lock e falha se ele
      # estiver fora de sincronia com o package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      # `npm run build` já inclui `tsc --noEmit`.
      - name: Build
        run: npm run build

      - name: Orçamento de tamanho
        env:
          SIZE_BUDGET_KB: '350'
        run: node scripts/size-report.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
